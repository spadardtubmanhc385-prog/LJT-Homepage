name: Build site check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check rendered content
        run: |
          echo "--- Published pages ---"
          find _site -name index.html | sort
          echo "--- Homepage headings and publication entries ---"
          grep -o '<h2[^>]*>[^<]*</h2>' _site/index.html
          grep -c 'archive-single\|SynLogic\|Perception Bottleneck\|Truthfulness Hyperplane\|In-Context Sharpness\|C-Eval\|Composing Parameter-Efficient' _site/index.html
          echo "--- Homepage contact and profile ---"
          grep -o 'jliugi@connect.ust.hk\|github.com/Vicent0205\|twitter.com/junteng88716710\|tbK9jl4AAAAJ\|Junteng Liu\|HKUST NLP Group' _site/index.html | sort | uniq -c
          echo "--- Navigation ---"
          grep -o '<a href="[^"]*">\(About\|Publications\|Talks\|Teaching\|Portfolio\|Blog Posts\|CV\|Guide\)</a>' _site/index.html
          echo "--- Publications page entries ---"
          grep -o '<h2 class="archive__item-title"[^>]*>' _site/publications/index.html
          echo "--- Placeholder scan ---"
          grep -rl 'Your Name\|Your Sidebar Name\|GitHub University\|Paper Title Number\|Red Brick University\|none@example.org' _site --include='*.html' || echo "No placeholders found"